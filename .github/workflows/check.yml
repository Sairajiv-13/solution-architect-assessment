name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy
      - run: uv run python -m assessment.demo
      # The clinical server runs in its own environment: its dependency set
      # conflicts with the gateway's pinned set, so it is never installed
      # into the project venv. Linux only; Windows coverage stays local.
      - name: Run the demo against the real clinical MCP server
        if: matrix.os == 'ubuntu-latest'
        run: |
          uv venv .venv-clinical
          uv pip install --python .venv-clinical/bin/python git+https://github.com/Sairajiv-13/clinical-trials-mcp-server.git
          CLINICAL_MCP_PYTHON="$PWD/.venv-clinical/bin/python" uv run python -m assessment.demo
  container:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and run the container
        run: |
          docker build -t solution-architect-assessment:"$GITHUB_REF_NAME" .
          docker run --rm solution-architect-assessment:"$GITHUB_REF_NAME"
      - name: Attach the container to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker save solution-architect-assessment:"$GITHUB_REF_NAME" | gzip > solution-architect-assessment-linux-amd64.tar.gz
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes "Load the Linux amd64 image with docker load, then run it to exercise the loopback demo." \
            solution-architect-assessment-linux-amd64.tar.gz
